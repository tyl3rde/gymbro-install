<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 829" width="1280" height="829" role="img" aria-labelledby="gymbro-install-t gymbro-install-d">
  <title id="gymbro-install-t">Gymbro-Installer: alle Schritte</title>
  <desc id="gymbro-install-d">Der Ein-Befehl-Installer läuft ab: Er prüft root und lädt die Release-Dateien, installiert Docker, fragt Domain, E-Mail für Let's Encrypt, Admin-Name, PIN und Version, prüft den DNS-Eintrag, schreibt die .env mit Secrets und Push-Schlüsseln, richtet auf Wunsch die Firewall ein, zieht das Image und startet die Container, legt Datenbank und Admin an und prüft zum Schluss die Login-Seite über HTTPS.</desc>
