y="256" width="59.04" height="27" fill="#08090A"/><rect class="caret k6" x="306" y="260" width="9" height="19" rx="1.5" fill="#B9BEC4"/></g></g><g class="l7"><text class="mono" x="62" y="302" font-size="16" fill="#F3F3F1" textLength="292.8">PIN für den Admin (4 Ziffern):</text><text class="mono" x="364.56" y="302" font-size="16" fill="#F3F3F1" fill-opacity="0.35">(verdeckt)</text></g><g class="l8"><text class="mono" x="62" y="329" font-size="16" fill="#F3F3F1" textLength="156.16">PIN wiederholen:</text><text class="mono" x="227.92" y="329" font-size="16" fill="#F3F3F1" fill-opacity="0.35">(verdeckt)</text></g><g class="l9"><text class="mono" x="62" y="356" font-size="16" fill="#F3F3F1" textLength="234.24">Beta installieren? [j/N]</text><text class="mono" x="306" y="356" font-size="16" fill="#B9BEC4" textLength="9.76">N</text><g class="c9"><rect class="cover" x="305" y="337" width="29.76" height="27" fill="#08090A"/><rect class="caret k9" x="306" y="341" width="9" height="19" rx="1.5" fill="#B9BEC4"/></g></g><g class="l10"><text class="mono" x="62" y="383" font-size="16" fill="#D4FF1F">✓ Image: ghcr.io/tyl3rde/gymbro:latest</text></g><g class="l11"><text class="mono" x="62" y="410" font-size="16" fill="#D4FF1F">✓ DNS zeigt auf diesen Server (203.0.113.10).</text></g><g class="l12"><text class="mono" x="62" y="437" font-size="16" fill="#38E1C6">▸ Generiere Secrets …</text></g><g class="l13"><text class="mono" x="62" y="464" font-size="16" fill="#38E1C6">▸ Generiere VAPID-Keypair für WebPush (via node-Container) …</text></g><g class="l14"><text class="mono" x="62" y="491" font-size="16" fill="#D4FF1F">✓ .env geschrieben (/opt/gymbro/.env, chmod 600).</text></g><g class="l15"><text class="mono" x="62" y="518" font-size="16" fill="#F3F3F1" textLength="653.92">ufw-Firewall einrichten (SSH, 80, 443 erlauben + aktivieren)? [J/n]</text><text class="mono" x="725.68" y="518" font-size="16" fill="#B9BEC4" textLength="9.76">J</text><g class="c15"><rect class="cover" x="724.68" y="499" width="29.76" height="27" fill="#08090A"/><rect class="caret k15" x="725.68" y="503" width="9" height="19" rx="1.5" fill="#B9BEC4"/></g></g><g class="l16"><text class="mono" x="62" y="545" font-size="16" fill="#D4FF1F">✓ ufw aktiv (OpenSSH, 80, 443).</text></g><g class="l17"><text class="mono" x="62" y="572" font-size="16" fill="#38E1C6">▸ Ziehe Image ghcr.io/tyl3rde/gymbro:latest …</text></g><g class="l18"><text class="mono" x="62" y="599" font-size="16" fill="#38E1C6">▸ Starte Container …</text></g><g class="l19"><text class="mono" x="62" y="626" font-size="16" fill="#D4FF1F">✓ App ist gesund.</text></g><g class="l20"><text class="mono" x="62" y="653" font-size="16" fill="#D4FF1F">✓ Datenbank angelegt.</text></g><g class="l21"><text class="mono" x="62" y="680" font-size="16" fill="#D4FF1F">✓ Admin &quot;Alex&quot; (gymbro_admin) angelegt — Login mit der gewählten PIN.</text></g><g class="l22"><text class="mono" x="62" y="707" font-size="16" fill="#38E1C6">▸ Prüfe https://gymbro.example.de (Zertifikat kann ~30 s dauern) …</text></g><g class="l23"><text class="mono" x="62" y="734" font-size="16" fill="#D4FF1F">✓ https://gymbro.example.de antwortet mit der Login-Seite.</text></g><g class="l24"><text class="mono" x="62" y="761" font-size="16" font-weight="700" fill="#D4FF1F">✓ Fertig!</text></g></g>
